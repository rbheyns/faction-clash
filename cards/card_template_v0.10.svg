<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="2000" height="3000" viewBox="0 0 2000 3000">

<!-- ============================================================
     Faction Clash — card_template_v0.10.svg
     STATUS: LOCKED — font/color/curve styling AND text-box
     positioning both approved. Do not edit this file further;
     changes go in a new versioned file (v0.11+).
     ============================================================
     v0.10 change from v0.9: EFFECT and FLAVOR text now use
     CENTER-ANCHORED positioning, measured directly from a marked
     reference image (green boxes + anchor dot) rather than a
     fixed top-line-grows-downward approach:

       EFFECT anchor: (1000, 2200) — box x=484-1511, y=2053-2348
       FLAVOR anchor: (1000, 2512) — box x=487-1514, y=2445-2580

     Growth model: text grows OUTWARD from the anchor point, not
     downward from a fixed top. For N lines at line-height LH:
       - 1 line:  baseline = anchor Y
       - 2 lines: baselines = anchor Y - LH/2, anchor Y + LH/2
       - (generalizes: baseline_i = anchorY - (N-1)*LH/2 + i*LH)
     This keeps short text centered in the box and long (wrapped)
     text centered too, rather than short text sitting high and
     long text sitting low — confirmed against both a 1-line case
     (Counter Intelligence) and a 2-line case (Shield Bear).

     Line heights unchanged: effect=60px (48px font), flavor=52px
     (44px font). Box widths (~1027px, x≈487-1514) are the
     practical wrap boundary for whoever builds live auto-wrap —
     not yet enforced in this static template.

     NAME styling (font/case/color/shadow/curve) is UNCHANGED from
     the v0.9 lock. card_text_styling_locked_v1.md is still
     accurate for name; needs a v2 addendum for effect/flavor's
     new anchor system (positions changed, font/size/color/
     keyword-bold did not).
     ============================================================ -->

<defs>
  <clipPath id="ArtworkMask">
    <rect x="144" y="173" width="1717" height="2630"/>
  </clipPath>

  <path id="NameCurve" d="M 550 1858 Q 1000 1836 1450 1858" fill="none"/>

  <filter id="nameShadow" x="-30%" y="-30%" width="160%" height="160%">
    <feDropShadow dx="0" dy="4" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.75"/>
  </filter>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@700&amp;family=Libre+Baskerville:ital,wght@0,400;1,400&amp;family=PT+Serif:wght@700&amp;display=swap');

    .cardName    {
      font-family: 'Cinzel', Georgia, serif; font-weight: 700;
      font-variant-caps: small-caps; font-variant: small-caps;
    }
    .effectText  { font-family: 'Libre Baskerville', Georgia, serif; font-weight: 400; }
    .effectText  .kw { font-weight: 700; }
    .flavorText  { font-family: 'Libre Baskerville', Georgia, serif; font-style: italic; font-weight: 400; }
    .statNumber  {
      font-family: 'PT Serif', Georgia, serif; font-weight: 700;
      fill: #ffffff; stroke: #000000; stroke-width: 4px; paint-order: stroke fill;
    }
  </style>
</defs>

<!-- ============ LAYER 1: ILLUSTRATION ============ -->
<g id="IllustrationLayer" clip-path="url(#ArtworkMask)">
  <image id="CardArt"
         xlink:href="art/CARD_ID.png" href="art/CARD_ID.png"
         x="144" y="173" width="1717" height="2630"
         preserveAspectRatio="xMidYMid meet"/>
</g>

<!-- ============ LAYER 2: FRAME (rarity-specific, unified asset) ============ -->
<g id="FrameLayer">
  <image id="FrameTexture"
         xlink:href="frames/frame_common.png" href="frames/frame_common.png"
         x="0" y="0" width="2000" height="3000"/>
</g>

<!-- ============ LAYER 3: TYPE GEM (top right) ============ -->
<g id="TypeGemLayer">
  <image id="TypeGem"
         xlink:href="icons/type_spell.png" href="icons/type_spell.png"
         x="0" y="0" width="2000" height="3000"/>
</g>

<!-- ============ LAYER 4: CARD BOTTOM ============ -->
<g id="CardBottomLayer">
  <!-- (none — spell test card) -->
</g>

<!-- ============ LAYER 5-7: TEXT ============ -->
<g id="TextLayer">

  <!-- Cost -->
  <text class="statNumber" x="290" y="298"
        text-anchor="middle" dominant-baseline="central"
        font-size="130">1</text>

  <!-- Attack / Health / Duration — reference only, inactive here:
  <text class="statNumber" x="296" y="2640" text-anchor="middle" dominant-baseline="central" font-size="130">2</text>
  <text class="statNumber" x="1726" y="2658" text-anchor="middle" dominant-baseline="central" font-size="130">2</text>
  <text class="statNumber" x="999" y="2759" text-anchor="middle" dominant-baseline="central" font-size="130">3</text>
  -->

  <!-- Name — shifted down to actually center on the nameplate -->
  <text class="cardName" font-size="78" fill="#230B00" filter="url(#nameShadow)">
    <textPath xlink:href="#NameCurve" href="#NameCurve" startOffset="50%" text-anchor="middle">Counter Intel</textPath>
  </text>

  <!-- Effect text — bigger -->
  <text class="effectText" x="1000" y="2200" text-anchor="middle" font-size="48" fill="#523C26">See the <tspan class="kw">lowest cost card</tspan>.</text>

  <!-- Flavor text — same color as effect text now, nudged down -->
  <text class="flavorText" x="1000" y="2512" text-anchor="middle" font-size="44" fill="#523C26">"Shhh... don't tell them, I told you."</text>

</g>

</svg>
